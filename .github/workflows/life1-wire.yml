name: LIFE-1 wire compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  c-wire-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Jawaka
        uses: actions/checkout@v4
        with:
          path: Jawaka

      - name: Verify fork-safe C protocol behavior
        run: make -C Jawaka ctl1-test life1-test ipc-stream-test

      - name: Check out the pinned service contracts
        uses: actions/checkout@v4
        with:
          repository: Utility-Muffin-Research-Kitchen/leaf-contracts
          ref: ad5b27d3489c0dd7f3ebecb787563e8703c14945
          path: leaf-contracts

      - name: Verify C framing against canonical fixtures
        run: make -C Jawaka WORKSPACE_ROOT="$GITHUB_WORKSPACE" wire-fixture-test
