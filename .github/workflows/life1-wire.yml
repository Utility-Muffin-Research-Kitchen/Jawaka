name: LIFE-1 wire compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  c-wire-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Jawaka
        uses: actions/checkout@v4
        with:
          path: Jawaka

      - name: Verify fork-safe C protocol behavior
        run: make -C Jawaka ctl1-test life1-test ipc-stream-test

      - name: Check out the pinned service contracts
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          repository: Utility-Muffin-Research-Kitchen/umrk-workspace
          ref: 5ab17d82c122b481f15c835e6ff9a21829d45aa9
          ssh-key: ${{ secrets.UMRK_WORKSPACE_DEPLOY_KEY }}
          path: umrk-workspace

      - name: Verify C framing against canonical fixtures
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: make -C Jawaka WORKSPACE_ROOT="$GITHUB_WORKSPACE" wire-fixture-test
