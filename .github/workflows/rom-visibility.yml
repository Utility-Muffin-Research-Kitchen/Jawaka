name: ROM visibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Jawaka
      - uses: actions/checkout@v4
        with:
          repository: Utility-Muffin-Research-Kitchen/Catastrophe
          ref: d06f22cd9919fb516749018fe5cd9bf942fc3fef
          path: Catastrophe
      - name: Install native renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsqlite3-dev libcurl4-openssl-dev
      - name: Database migration, visibility and relocation
        run: make -C Jawaka schema-v6-test visibility-test relocation-test
      - name: Launcher, Hidden Games and empty in-game switcher
        run: make -C Jawaka visibility-ui-test settings-status-test game-switcher-test
